<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truco RL WebApp</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap');

        :root {
            --table-green: radial-gradient(circle at center, #2e7d32 0%, #1b5e20 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-light: #ffffff;
            --accent: #ffd54f;
            --accent-hover: #ffecb3;
            --danger: #ef5350;
            --danger-hover: #ff8a80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--table-green);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        /* Header / Scoreboard */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            gap: 3rem;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            z-index: 10;
        }

        .score-box {
            padding: 0.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 150px;
        }
        
        .score-box span {
            font-size: 1rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-box strong {
            font-size: 3rem;
            color: var(--accent);
            text-shadow: 0 2px 10px rgba(255, 213, 79, 0.4);
        }

        /* Main Game Area */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 280px;
            gap: 1.5rem;
            padding: 1rem 2rem;
            height: calc(100vh - 250px);
        }

        /* Logs Panel */
        .logs-panel {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .logs-panel h3 {
            margin-bottom: 1rem;
            font-family: 'Outfit', sans-serif;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #logs-container {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-right: 0.5rem;
        }

        /* Custom scrollbar for logs */
        #logs-container::-webkit-scrollbar { width: 6px; }
        #logs-container::-webkit-scrollbar-track { background: transparent; }
        #logs-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .log-entry {
            font-size: 0.9rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-out;
            padding: 0.4rem;
            border-radius: 4px;
            background: rgba(0,0,0,0.1);
        }
        
        .log-entry.human { color: #81d4fa; border-left: 3px solid #81d4fa; }
        .log-entry.ai { color: #ffab91; border-left: 3px solid #ffab91; }
        .log-entry.system { color: #fff59d; font-style: italic; border-left: 3px solid #fff59d; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Center Table */
        .table-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(0,0,0,0.1);
            border-radius: 200px; /* oval shape for the inner table */
            border: 2px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
        }
        
        .rounds-container {
            display: flex;
            gap: 3rem;
        }
        
        .round {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            position: relative;
        }
        
        .round-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            opacity: 0.1;
            text-transform: uppercase;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            z-index: 0;
            pointer-events: none;
        }

        .card {
            width: 90px;
            height: 135px;
            background: #fff;
            border-radius: 8px;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0.5rem;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 3px solid white;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            user-select: none;
            z-index: 1;
        }
        
        .card.empty {
            background: transparent;
            border: 2px dashed rgba(255,255,255,0.2);
            box-shadow: none;
            color: rgba(255,255,255,0.3);
            font-weight: 400;
        }

        .card.win {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 213, 79, 0.6);
            transform: scale(1.05);
            z-index: 2;
        }

        /* Action Panel */
        .actions-panel {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            justify-content: center;
            overflow-y: auto;
        }

        .actions-panel::-webkit-scrollbar { width: 0; }

        .btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.9rem 1rem;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            transition: all 0.5s ease;
        }
        
        .btn:hover::after {
            left: 150%;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            border-color: rgba(255,255,255,0.4);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            display: none;
        }

        .btn.primary {
            background: var(--accent);
            color: #333;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 213, 79, 0.3);
        }
        
        .btn.primary:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn.danger {
            background: var(--danger);
            border: none;
            box-shadow: 0 4px 10px rgba(239, 83, 80, 0.3);
        }
        
        .btn.danger:hover:not(:disabled) {
            background: var(--danger-hover);
        }

        /* Bottom Hand */
        .hand-area {
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding-bottom: 2rem;
            perspective: 1000px;
            background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 100%);
        }

        .hand-card {
            width: 120px;
            height: 180px;
            background: #fff;
            border-radius: 12px;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
            font-weight: 800;
            font-size: 1.4rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: bottom center;
            border: 4px solid white;
            position: relative;
        }

        .hand-card::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 6px;
            pointer-events: none;
        }

        .hand-card:not(.disabled):hover {
            transform: translateY(-30px) rotate(2deg) scale(1.05);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            z-index: 10;
            border-color: var(--accent);
        }

        .hand-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(80%);
            transform: translateY(20px);
        }

        .hand-card.played {
            display: none;
        }

        /* Overlay for Terminal State */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            border-radius: 200px; /* Match table-area */
        }
        
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            color: white;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 1400px) {
            main {
                grid-template-columns: 250px 1fr 240px;
                padding: 1rem;
                gap: 1rem;
            }
            .rounds-container {
                gap: 1.5rem;
            }
            .card {
                width: 75px;
                height: 110px;
            }
        }

        @media (max-width: 1100px) {
            header {
                padding: 1rem;
                gap: 1.5rem;
            }
            .score-box strong {
                font-size: 2.2rem;
            }
            main {
                grid-template-columns: 200px 1fr 200px;
                height: calc(100vh - 200px);
            }
            .card {
                width: 65px;
                height: 95px;
                font-size: 0.8rem;
            }
            .hand-area {
                height: 180px;
                padding-bottom: 1rem;
            }
            .hand-card {
                width: 90px;
                height: 135px;
                font-size: 1.1rem;
            }
            .btn {
                padding: 0.7rem 0.5rem;
                font-size: 0.85rem;
            }
            .actions-panel {
                padding: 1rem;
            }
            .logs-panel {
                padding: 1rem;
            }
        }

        @media (max-width: 850px) {
            body {
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }
            main {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .table-area {
                order: 1;
                min-height: 300px;
                padding: 2rem 0;
            }
            .actions-panel {
                order: 2;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.5rem;
            }
            .actions-panel .btn {
                flex: 1 1 30%;
                min-width: 100px;
            }
            .actions-panel > div {
                display: none; /* hide spacers */
            }
            .logs-panel {
                order: 3;
                min-height: 200px;
            }
            .hand-area {
                height: auto;
                padding: 2rem 1rem;
                flex-wrap: wrap;
                position: static;
                background: none;
            }
            .hand-card:not(.disabled):hover {
                transform: translateY(-10px) scale(1.05);
            }
        }

        @media (max-width: 500px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                padding: 1rem;
            }
            .score-box {
                min-width: 80px;
                padding: 0.5rem;
            }
            .rounds-container {
                gap: 0.5rem;
            }
            .card {
                width: 55px;
                height: 80px;
                font-size: 0.7rem;
                border-width: 2px;
            }
            .round {
                gap: 1rem;
            }
            .hand-card {
                width: 70px;
                height: 105px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="score-box glass">
            <span>Vos</span>
            <strong id="score-human">0</strong>
        </div>
        <div style="font-size: 2rem; opacity: 0.8; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">⚔️</div>
        <div class="score-box glass">
            <span>IA</span>
            <strong id="score-ai">0</strong>
        </div>
    </header>

    <main>
        <aside class="logs-panel glass">
            <h3>Historial de Movimientos</h3>
            <div id="logs-container">
                <!-- Logs will appear here -->
            </div>
        </aside>

        <section class="table-area">
            <div class="rounds-container" id="rounds-container">
                <!-- Rounds will be injected here -->
            </div>
            
            <div class="overlay" id="terminal-overlay">
                <h2 id="terminal-message">Fin de la mano</h2>
                <button class="btn primary" id="next-round-btn" style="font-size: 1.5rem; padding: 1rem 3rem; border-radius: 50px;">Siguiente Mano</button>
            </div>
        </section>

        <aside class="actions-panel glass">
            <button class="btn" id="btn-3" onclick="sendAction(3)">Envido</button>
            <button class="btn" id="btn-4" onclick="sendAction(4)">Real Envido</button>
            <button class="btn" id="btn-5" onclick="sendAction(5)">Falta Envido</button>
            
            <div style="height: 10px;"></div> <!-- Spacer -->
            
            <button class="btn" id="btn-6" onclick="sendAction(6)">Truco</button>
            <button class="btn" id="btn-7" onclick="sendAction(7)">Retruco</button>
            <button class="btn" id="btn-8" onclick="sendAction(8)">Vale 4</button>
            
            <div style="height: 10px;"></div> <!-- Spacer -->
            
            <button class="btn primary" id="btn-9" onclick="sendAction(9)">Quiero</button>
            <button class="btn danger" id="btn-10" onclick="sendAction(10)">No Quiero</button>
            
            <div style="flex-grow: 1;"></div> <!-- Push rest to bottom -->
            
            <button class="btn danger" id="btn-11" onclick="sendAction(11)">Al Mazo</button>
            <button class="btn primary" id="btn-start" onclick="startGame()" style="margin-top: 1rem; border: 1px solid rgba(255,255,255,0.4); background: rgba(255, 213, 79, 0.1); color: var(--accent);">Reiniciar Partido</button>
        </aside>
    </main>

    <footer class="hand-area" id="hand-container">
        <!-- Cards injected here -->
    </footer>

    <script>
        const API_URL = '';
        let validActions = [];

        async function startGame() {
            try {
                const response = await fetch(`${API_URL}/start`, { method: 'POST' });
                const state = await response.json();
                renderState(state);
                hideOverlay();
            } catch (error) {
                console.error("Error starting game", error);
            }
        }

        async function sendAction(actionId) {
            try {
                const response = await fetch(`${API_URL}/step`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action_id: actionId })
                });
                const state = await response.json();
                renderState(state);
            } catch (error) {
                console.error("Error sending action", error);
            }
        }

        document.getElementById('next-round-btn').addEventListener('click', () => {
            hideOverlay();
            sendAction(-1); // Advance round
        });

        function hideOverlay() {
            document.getElementById('terminal-overlay').classList.remove('active');
        }

        function showOverlay(message, isMatchOver) {
            const overlay = document.getElementById('terminal-overlay');
            const msgEl = document.getElementById('terminal-message');
            const btnEl = document.getElementById('next-round-btn');
            
            msgEl.innerHTML = message;
            
            if (isMatchOver) {
                btnEl.style.display = 'none'; // User must click Restart in sidebar
            } else {
                btnEl.style.display = 'inline-block';
            }
            
            overlay.classList.add('active');
        }

        function renderState(state) {
            validActions = state.valid_actions || [];

            // Scores
            document.getElementById('score-human').textContent = state.scores.human;
            document.getElementById('score-ai').textContent = state.scores.ai;

            // Logs
            const logsContainer = document.getElementById('logs-container');
            logsContainer.innerHTML = '';
            state.log.forEach(l => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                if (l.includes('VOS')) div.classList.add('human');
                else if (l.includes('IA')) div.classList.add('ai');
                else div.classList.add('system');
                div.textContent = l;
                logsContainer.appendChild(div);
            });
            logsContainer.scrollTop = logsContainer.scrollHeight;

            // Table Cards
            const roundsContainer = document.getElementById('rounds-container');
            roundsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const roundData = state.table_cards[i];
                
                const col = document.createElement('div');
                col.className = 'round';
                
                const title = document.createElement('div');
                title.className = 'round-title';
                title.textContent = `Ronda ${i + 1}`;
                
                // AI Card (Top)
                const cardAi = document.createElement('div');
                cardAi.className = 'card';
                if (roundData && roundData.ai_card) {
                    cardAi.textContent = roundData.ai_card;
                    if (roundData.winner === 'ai' || roundData.winner === 'tie') {
                        cardAi.classList.add('win');
                    }
                } else {
                    cardAi.classList.add('empty');
                    cardAi.textContent = 'IA';
                }

                // Human Card (Bottom)
                const cardHum = document.createElement('div');
                cardHum.className = 'card';
                if (roundData && roundData.human_card) {
                    cardHum.textContent = roundData.human_card;
                    if (roundData.winner === 'human' || roundData.winner === 'tie') {
                        cardHum.classList.add('win');
                    }
                } else {
                    cardHum.classList.add('empty');
                    cardHum.textContent = 'VOS';
                }

                col.appendChild(title);
                col.appendChild(cardAi);
                col.appendChild(cardHum);
                roundsContainer.appendChild(col);
            }

            // Hand Cards
            const handContainer = document.getElementById('hand-container');
            handContainer.innerHTML = '';
            state.player_cards.forEach(card => {
                const div = document.createElement('div');
                div.className = 'hand-card';
                
                if (card.played) {
                    div.classList.add('played');
                } else {
                    div.textContent = card.name;
                    
                    if (validActions.includes(card.id) && !state.is_terminal && !state.match_over) {
                        div.onclick = () => sendAction(card.id);
                    } else {
                        div.classList.add('disabled');
                    }
                }
                handContainer.appendChild(div);
            });

            // Action Buttons
            for (let i = 3; i <= 11; i++) {
                const btn = document.getElementById(`btn-${i}`);
                if (btn) {
                    if (validActions.includes(i) && !state.is_terminal && !state.match_over) {
                        btn.style.display = 'block';
                        btn.disabled = false;
                    } else {
                        btn.style.display = 'none';
                        btn.disabled = true;
                    }
                }
            }
            
            // Show start button prominently if game is over
            const startBtn = document.getElementById('btn-start');
            if (state.match_over) {
                startBtn.style.background = 'var(--accent)';
                startBtn.style.color = '#333';
                startBtn.style.transform = 'scale(1.05)';
            } else {
                startBtn.style.background = 'rgba(255, 213, 79, 0.1)';
                startBtn.style.color = 'var(--accent)';
                startBtn.style.transform = 'scale(1)';
            }

            // Handle Terminal States
            if (state.match_over) {
                const msg = state.scores.human >= 30 ? "🏆<br>¡GANASTE EL PARTIDO!" : "💀<br>LA IA GANA EL PARTIDO";
                showOverlay(msg, true);
            } else if (state.is_terminal) {
                showOverlay("Fin de la mano", false);
            }
        }

        // Initialize game on load
        window.onload = startGame;

    </script>
</body>
</html>
